[tool:pytest]
# Configurações do pytest

# Caminho para coverage
testpaths = tests
addopts = 
    --cov=src/corrige_engsoftw
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=60

# Ignore deprecation warnings
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
# Arquivo de configuração do coverage
source = src
omit =
    */tests/*
    */setup.py
    */__pycache__/*

[coverage:report]
# Relatório de coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

precision = 2
show_missing = True

[coverage:html]
# Relatório HTML
directory = htmlcov
