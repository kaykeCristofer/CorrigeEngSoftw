[pytest]
# Configuração do pytest para o projeto

# Diretórios de testes
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers customizados
markers =
    unit: testes unitários
    integration: testes de integração
    performance: testes de performance
    slow: testes lentos
    api: testes que usam API externa
    mock: testes que usam mocks

# Timeout para testes (evitar testes travados)
timeout = 300

# Coverage
# Executar: pytest --cov=src --cov-report=html
