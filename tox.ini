[tox]
# Tox para testar em múltiplos ambientes Python
envlist = py39,py310,py311,lint,coverage

[testenv]
# Ambiente padrão para testes
deps =
    -r{toxinidir}/requirements-test.txt
commands =
    pytest {posargs:tests/}

[testenv:py39]
# Python 3.9
basepython = python3.9

[testenv:py310]
# Python 3.10
basepython = python3.10

[testenv:py311]
# Python 3.11
basepython = python3.11

[testenv:lint]
# Lint environment
skip_install = True
deps =
    black
    flake8
    isort
    mypy
commands =
    flake8 src/ tests/
    isort --check-only src/ tests/
    mypy src/

[testenv:coverage]
# Coverage environment
deps =
    -r{toxinidir}/requirements-test.txt
commands =
    pytest --cov=src/corrige_engsoftw --cov-report=html --cov-report=term-missing tests/

[testenv:docs]
# Documentation environment
deps =
    sphinx
    sphinx-rtd-theme
commands =
    sphinx-build -W -b html docs/ docs/_build/

[pytest]
testpaths = tests
